name: i686 windows-gnu probe

on:
  push:
    branches: [ci-32bit-fix]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the build-std route on the buildbot's toolchain
        run: |
          docker run --rm -v "$PWD":/src -w /src ubuntu:bionic bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -yqq curl ca-certificates build-essential \
              gcc-mingw-w64-i686 g++-mingw-w64-i686 git >/dev/null
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile minimal >/dev/null
            . $HOME/.cargo/env
            rustup component add rust-src
            rustup target add i686-pc-windows-gnu
            export CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER=i686-w64-mingw32-gcc
            RUSTFLAGS="-Cpanic=abort" cargo build --release --target i686-pc-windows-gnu \
              -Z build-std=std,panic_abort
            DLL=target/i686-pc-windows-gnu/release/bbkemu.dll
            ls -la $DLL
            i686-w64-mingw32-objdump -f $DLL | head -4
            echo "--- exported retro_ symbols ---"
            i686-w64-mingw32-objdump -p $DLL | grep -oE "retro_[a-z_]+" | sort -u
            echo "--- unwind references (expect none) ---"
            i686-w64-mingw32-objdump -p $DLL | grep -c "_Unwind" || true
          '
