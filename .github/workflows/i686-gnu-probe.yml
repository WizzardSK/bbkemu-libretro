name: i686 windows-gnu probe

on:
  push:
    branches: [ci-32bit-fix]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce the buildbot's toolchain (bionic + its mingw)
        run: |
          docker run --rm -v "$PWD":/src -w /src ubuntu:bionic bash -c '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -yqq curl ca-certificates build-essential \
              gcc-mingw-w64-i686 g++-mingw-w64-i686 git >/dev/null
            echo "===== gcc -v ====="
            i686-w64-mingw32-gcc -v 2>&1
            echo "===== libgcc_eh unwind symbols ====="
            for f in $(find / -name libgcc_eh.a 2>/dev/null | grep i686-w64); do
              echo "-- $f"
              nm -g "$f" 2>/dev/null | grep -E "T _Unwind_(Resume|SjLj_Resume)" | sort -u
            done
            echo "===== rustup ====="
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile minimal >/dev/null
            . $HOME/.cargo/env
            rustup component add rust-src
            rustup target add i686-pc-windows-gnu
            export CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER=i686-w64-mingw32-gcc
            echo "===== route A: plain cargo build ====="
            cargo build --release --target i686-pc-windows-gnu > /tmp/a.log 2>&1
            echo "A_STATUS=$?"; tail -5 /tmp/a.log
            find target -name "*.dll" | head
            echo "===== route B: build-std + panic_immediate_abort ====="
            cargo build --release --target i686-pc-windows-gnu \
              -Z build-std=std,panic_abort \
              -Z build-std-features=panic_immediate_abort > /tmp/b.log 2>&1
            echo "B_STATUS=$?"; tail -25 /tmp/b.log
            find target -name "*.dll" | head
            for d in $(find target -name "*.dll"); do file "$d"; i686-w64-mingw32-nm -g "$d" 2>/dev/null | grep -c retro_run; done
          '
